<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>폰 시뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 폰 프레임을 가운데(넓은 화면에서는 왼쪽)에 두고, 오른쪽에 시나리오 힌트와 컨트롤 패널을 놓는다. */
:root{
  --bg:#e8ecf1; --fg:#16202b; --muted:#5d6b7a; --panel:#f6f8fa; --line:#cfd7e0;
  --accent:#0b8f7e; --accent-fg:#ffffff;
  --font-body:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1218; --fg:#e6ecf2; --muted:#8d9bab; --panel:#161d26; --line:#26313d;
    --accent:#2fc4ae; --accent-fg:#06211c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1218; --fg:#e6ecf2; --muted:#8d9bab; --panel:#161d26; --line:#26313d;
  --accent:#2fc4ae; --accent-fg:#06211c; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body);
  padding-block:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.stage{max-width:1000px;margin:0 auto;display:flex;gap:40px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.sizer{flex:none}
.panel{flex:1 1 280px;max-width:380px;min-width:0;display:flex;flex-direction:column;gap:18px;padding-top:12px}
.panel h1{font-size:22px;line-height:1.3;margin:0;font-weight:700;text-wrap:balance}
.panel p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}
.panel h2{margin:0 0 8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hint-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hint-list li{font-size:13px;line-height:1.5;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
.hint-list b{font-weight:700}
.hint-list code{font-family:var(--font-mono);font-size:12px;color:var(--accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{font:inherit;font-size:13px;font-weight:500;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.pbtn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pbtn:focus-visible,.key:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Device ---------- */
.phone{
  position:relative;width:417px;height:876px;padding:12px;border-radius:68px;transform-origin:0 0;
  background:linear-gradient(145deg,#4a4d52,#1c1d20 40%,#2b2d31);
  box-shadow:0 0 0 2px #0a0a0b,0 30px 70px rgba(5,10,20,.45);
}
.phone::before,.phone::after{content:"";position:absolute;width:4px;background:#2a2c30;border-radius:2px}
.phone::before{left:-3px;top:150px;height:56px;box-shadow:0 78px 0 #2a2c30,0 150px 0 #2a2c30}
.phone::after{right:-3px;top:210px;height:92px}
.screen{
  --ink:#111114; --ink2:#6c6c72; --sep:rgba(60,60,67,.2); --blue:#0a7cff; --green:#34c759; --red:#ff3b30;
  --fill:#f2f2f7; --card:#ffffff; --sb:#fff;
  --wall:radial-gradient(120% 70% at 15% 0%,#58d3c0 0%,transparent 55%),radial-gradient(110% 80% at 100% 100%,#6a4fe0 0%,transparent 60%),#14213d;
  position:relative;width:393px;height:852px;border-radius:56px;overflow:hidden;background:#000;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Noto Sans KR',sans-serif;font-size:16px;
  -webkit-user-select:none;user-select:none;
}
.screen.dark-sb{--sb:#111}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:20px;background:#000;z-index:90}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:80;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 44px;color:var(--sb);font-weight:600;font-size:16px;pointer-events:none;transition:color .2s}
.statusbar .icons{display:flex;gap:6px;align-items:center}
.statusbar svg{display:block;fill:currentColor}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--sb);z-index:85;opacity:.9;cursor:pointer;transition:background .2s}
.homebar::after{content:"";position:absolute;inset:-14px -10px}

.app{position:absolute;inset:0;display:none;flex-direction:column;background:var(--fill);z-index:10}
.app.open{display:flex;animation:appin .22s ease-out}
@keyframes appin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.view{position:absolute;inset:0;display:none;flex-direction:column;background:var(--fill)}
.view.on{display:flex}
.nav{padding:58px 16px 8px;display:flex;align-items:flex-end;justify-content:space-between;min-height:96px}
.nav h3{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em}
.scroll{flex:1;overflow-y:auto;min-height:0;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
button{font-family:inherit;color:inherit}
.linkbtn{background:none;border:0;color:var(--blue);font-size:17px;cursor:pointer;padding:6px 4px}

/* wallpaper + home */
.home{background:var(--wall);z-index:5;display:flex;flex-direction:column;padding:70px 22px 0}
.home .clockbig{color:#fff;text-align:center;margin-bottom:26px}
.home .clockbig small{display:block;font-size:14px;opacity:.85;font-weight:500}
.home .clockbig strong{font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;justify-items:center}
.ico{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;color:#fff;font-size:11.5px;width:70px;position:relative}
.ico .sq{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .12s}
.ico:active .sq{transform:scale(.92)}
.ico svg{width:34px;height:34px}
.badge{position:absolute;top:-6px;right:2px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;font-weight:600;display:none;place-items:center;padding:0 6px;border:2px solid transparent}
.badge.on{display:grid}
.dock{position:absolute;left:14px;right:14px;bottom:28px;height:96px;border-radius:34px;background:rgba(255,255,255,.28);backdrop-filter:blur(18px);display:flex;justify-content:space-around;align-items:center;padding:0 10px}
.dock .ico .lb{display:none}.lb{font-style:normal}

/* shared list rows */
.group{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:.5px solid var(--sep);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row:active{background:rgba(0,0,0,.05)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:18px;flex:none}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv{color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{color:var(--ink2);font-size:13px;align-self:flex-start;margin-top:4px;display:flex;gap:6px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--blue);display:none}
.dot.on{display:inline-block}
.sec{margin:16px 32px 6px;font-size:13px;color:var(--ink2)}
.empty{padding:60px 30px;text-align:center;color:var(--ink2);font-size:15px;line-height:1.6}

/* Phone app */
.tabs{display:flex;justify-content:space-around;padding:8px 0 30px;background:rgba(249,249,251,.94);border-top:.5px solid var(--sep)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink2);font-size:10.5px;cursor:pointer;width:80px}
.tab.on{color:var(--blue)}
.tab svg{width:26px;height:26px;fill:currentColor}
.dialnum{height:62px;text-align:center;font-size:34px;font-weight:400;padding-top:10px;letter-spacing:.01em;min-height:62px}
.dialname{text-align:center;color:var(--ink2);font-size:14px;height:22px}
.keys{display:grid;grid-template-columns:repeat(3,78px);gap:14px 22px;justify-content:center;margin-top:20px}
.key{width:78px;height:78px;border-radius:50%;border:0;background:#dcdce1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;line-height:1;cursor:pointer}
.key small{font-size:10px;letter-spacing:.15em;color:var(--ink2);margin-top:2px;height:12px;font-weight:600}
.key:active{background:#b9b9c0}
.dialbottom{display:grid;grid-template-columns:78px 78px 78px;gap:22px;justify-content:center;margin-top:14px;align-items:center}
.callbtn{width:78px;height:78px;border-radius:50%;border:0;background:var(--green);display:grid;place-items:center;cursor:pointer}
.callbtn svg{width:34px;height:34px;fill:#fff}
.delbtn{background:none;border:0;color:var(--ink2);cursor:pointer;display:grid;place-items:center;visibility:hidden}
.delbtn.on{visibility:visible}
.sheetcard{padding:70px 24px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.sheetcard .av{width:110px;height:110px;font-size:44px}
.sheetcard h4{margin:10px 0 0;font-size:28px;font-weight:600}
.sheetcard p{margin:0;color:var(--ink2)}
.actions{display:flex;gap:12px;margin-top:22px}
.act{width:88px;padding:12px 0;border-radius:12px;background:var(--card);border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--blue);cursor:pointer}
.act svg{width:24px;height:24px;fill:var(--blue)}
.back{position:absolute;top:60px;left:12px;z-index:5}

/* Call screen */
.call{background:linear-gradient(180deg,#2e3a52,#161a26 70%);color:#fff;z-index:60;align-items:center;padding:80px 22px 40px}
.call .who{font-size:32px;font-weight:600;margin-top:6px}
.call .stat{opacity:.75;font-size:17px;margin-top:6px;font-variant-numeric:tabular-nums}
.call .av{width:92px;height:92px;font-size:38px;margin-top:4px}
.captions{flex:1;width:100%;margin:22px 0 16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;scrollbar-width:none;min-height:0}
.captions::-webkit-scrollbar{display:none}
.cap{max-width:88%;font-size:17px;line-height:1.5;padding:10px 14px;border-radius:16px;animation:pop .25s ease-out}
.cap.them{align-self:flex-start;background:rgba(255,255,255,.14)}
.cap.me{align-self:flex-end;background:rgba(10,124,255,.75)}
.cap .sp{display:block;font-size:11px;opacity:.7;margin-bottom:2px;letter-spacing:.04em}
.cap.sys{align-self:center;background:none;font-size:13px;opacity:.7;padding:2px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.callgrid{display:grid;grid-template-columns:repeat(3,70px);gap:14px 26px;margin-bottom:22px}
.cg{width:70px;height:70px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.cg.on{background:#fff;color:#111}
.cg svg{width:24px;height:24px;fill:currentColor}
.endbtn{width:72px;height:72px;border-radius:50%;border:0;background:var(--red);display:grid;place-items:center;cursor:pointer}
.endbtn svg{width:34px;height:34px;fill:#fff;transform:rotate(135deg)}
.incoming-actions{display:flex;justify-content:space-between;width:80%;margin-top:6px}
.incoming-actions .col{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px}
.accept{width:72px;height:72px;border-radius:50%;border:0;background:var(--green);display:grid;place-items:center;cursor:pointer}
.accept svg{width:34px;height:34px;fill:#fff}

/* Messages & Talk */
.thread-head{padding:54px 12px 8px;display:flex;align-items:center;gap:4px;background:rgba(249,249,251,.94);border-bottom:.5px solid var(--sep);min-height:100px;position:relative}
.thread-head .ctr{position:absolute;left:0;right:0;bottom:6px;text-align:center;pointer-events:none}
.thread-head .ctr .av{width:40px;height:40px;font-size:16px;margin:0 auto 2px}
.thread-head .ctr span{font-size:11.5px}
.msgs{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:4px;min-height:0;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.b{max-width:76%;padding:8px 13px;border-radius:19px;font-size:16.5px;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap;-webkit-user-select:text;user-select:text}.b.new{animation:pop .2s ease-out}
.b.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.b.them{align-self:flex-start;background:#e5e5ea;border-bottom-left-radius:6px}
.stamp{align-self:center;font-size:11.5px;color:var(--ink2);margin:8px 0 4px}
.typing{align-self:flex-start;background:#e5e5ea;border-radius:19px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:8px;height:8px;border-radius:50%;background:#9a9aa1;animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-2px)}}
.composer{display:flex;gap:8px;align-items:center;padding:8px 12px 30px;background:rgba(249,249,251,.94);border-top:.5px solid var(--sep)}
.composer input{flex:1;min-width:0;height:38px;border-radius:19px;border:1px solid #c6c6cc;background:#fff;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text}
.composer input:focus{border-color:var(--blue)}
.send{width:34px;height:34px;border-radius:50%;border:0;background:var(--blue);display:grid;place-items:center;cursor:pointer;flex:none}
.send svg{width:18px;height:18px;fill:#fff}
.send:disabled{background:#c6c6cc;cursor:default}
/* Talk skin */
.talk .view{background:#dde3ea}
.talk .list{background:#fff}
.talk .nav{background:#fff}
.talk .b.me{background:#f7d94c;color:#2b2500;border-radius:14px}
.talk .b.them{background:#fff;border-radius:14px}
.talk .typing{background:#fff;border-radius:14px}
.talk .send{background:#f7d94c}.talk .send svg{fill:#2b2500}
.talk .thread-head{background:#dde3ea;border-bottom:0}
.talk .composer{background:#fff}
.talk .composer input{border-radius:8px;background:#f2f4f6;border-color:transparent}
.talk .group{border-radius:0;margin:0;background:#fff}
.talk .row{padding:12px 16px}
.talk .av{border-radius:36%}
.talk .dot{background:var(--red)}

/* notification banner + toast */
.banner{position:absolute;top:10px;left:10px;right:10px;z-index:95;background:rgba(245,245,247,.96);border-radius:26px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);transform:translateY(-130%);transition:transform .35s cubic-bezier(.2,.9,.3,1.1);cursor:pointer;border:0;text-align:left;width:calc(100% - 20px);margin-top:48px}
.banner.on{transform:none}
.banner .ai{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
.banner .ai svg{width:22px;height:22px}
.banner .tx{min-width:0;flex:1}
.banner .tx b{display:block;font-size:14px}
.banner .tx span{display:block;font-size:13.5px;color:#3a3a40;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:rgba(30,30,34,.9);color:#fff;font-size:14px;padding:10px 16px;border-radius:20px;z-index:96;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* ---------- v2: 잠금화면, 홈 위젯, 새 앱 ---------- */
.banner{top:56px;margin-top:0;transform:translateY(-220%);opacity:0;visibility:hidden}
.banner.on{transform:none;opacity:1;visibility:visible}
.call{z-index:75}
.pwr{position:absolute;right:-9px;top:200px;width:14px;height:112px;border:0;background:transparent;cursor:pointer;z-index:3}
.lock{position:absolute;inset:0;z-index:70;background:var(--wall);color:#fff;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s;touch-action:none;overflow:hidden}
.lock.up{transform:translateY(-100%)}
.lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none;visibility:hidden}
.lk-top{position:absolute;top:70px;left:0;right:0;text-align:center}
.lk-lockic svg{width:20px;height:20px;fill:#fff;opacity:.9}
.lk-date{font-size:20px;font-weight:500;margin-top:4px;opacity:.95}
.lk-time{font-size:92px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:2px}
.lk-notifs{position:absolute;left:12px;right:12px;bottom:150px;display:flex;flex-direction:column;gap:8px}
.lkn{background:rgba(255,255,255,.24);backdrop-filter:blur(18px);border-radius:22px;padding:11px 14px;display:flex;gap:10px;align-items:center;animation:pop .3s ease-out}
.lkn .ai{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
.lkn .ai svg{width:22px;height:22px}
.lkn .tx{min-width:0;flex:1}.lkn .tx b{display:block;font-size:14px}.lkn .tx span{display:block;font-size:13.5px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lkn small{font-size:12px;opacity:.8;align-self:flex-start}
.lk-btn{position:absolute;bottom:70px;width:50px;height:50px;border-radius:50%;border:0;background:rgba(20,20,30,.38);backdrop-filter:blur(14px);display:grid;place-items:center;cursor:pointer}
.lk-btn svg{width:24px;height:24px;fill:#fff}
.lk-btn.l{left:44px}.lk-btn.r{right:44px}
.lk-hint{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:13px;opacity:.85;animation:hint 2.2s ease-in-out infinite;pointer-events:none}
@keyframes hint{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-5px);opacity:1}}
.pass{position:absolute;inset:0;z-index:69;background:var(--wall);color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:110px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,transform .4s,visibility .4s}
.pass::before{content:"";position:absolute;inset:0;background:rgba(10,12,24,.42);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
.pass>*{position:relative}
.pass.on{opacity:1;visibility:visible;pointer-events:auto}
.pass.gone{opacity:0;visibility:hidden;transform:scale(1.15);pointer-events:none}
.ps-title{font-size:19px;font-weight:500;height:26px}
.ps-dots{display:flex;gap:18px;margin-top:26px;height:14px}
.ps-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;display:block;transition:background .1s}
.ps-dots i.f{background:#fff}
.ps-dots.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-14px)}35%{transform:translateX(12px)}55%{transform:translateX(-9px)}75%{transform:translateX(6px)}}
.ps-keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px 24px;margin-top:46px}
.pk{width:76px;height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:34px;font-weight:300;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;cursor:pointer;transition:background .15s}
.pk:active{background:rgba(255,255,255,.5)}
.pk small{font-size:9.5px;letter-spacing:.14em;font-weight:600;margin-top:2px;height:11px}
.pk.z{grid-column:2}

.island{display:none}
.pwr{left:432px;right:auto;top:289px;width:20px;height:107px;z-index:101}
.statusbar{padding:7px 36px 0 52px;font-size:17px;font-family:-apple-system,'SF Pro Text',Inter,'Noto Sans KR',sans-serif}
.sq{overflow:hidden}
.sq img,.ai img{width:100%;height:100%;object-fit:cover;display:block}
.ai{overflow:hidden}
.calico small{font-size:10.5px;font-weight:600;color:#ff3b30;margin-top:5px;letter-spacing:0}
.calico b{font-size:36px;font-weight:400;color:#1c1c1e;margin-top:0;line-height:1.05}
.av.gr{background:linear-gradient(#a9afba,#868c97)}
/* 잠금화면 */
.lk-top{top:82px}
.lk-lockic{display:none}
.lk-date{font-size:21px;font-weight:600;margin-top:0;opacity:1;line-height:28px;font-family:-apple-system,'SF Pro Text',Inter,'Noto Sans KR',sans-serif}
.lk-time{font-size:104px;font-weight:700;letter-spacing:-.025em;line-height:1;margin-top:-2px;font-family:-apple-system,'SF Pro Display',Inter,'Helvetica Neue',sans-serif}
.lk-notifs{bottom:128px}
.lkn{background:rgba(214,210,218,.64);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);color:#141416;border-radius:26px;padding:12px 14px}
.lkn .ai{width:38px;height:38px;border-radius:9px}
.lkn .tx b{font-size:15.5px;font-weight:600}
.lkn .tx span{font-size:15px;opacity:1;color:#1c1c1f}
.lkn small{color:#5a5860;opacity:1}
.lk-btn{bottom:50px;background:rgba(20,14,18,.62)}
.lk-btn.l{left:46px}.lk-btn.r{right:46px}
.lk-hint{bottom:34px;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.45)}
/* 암호 입력 */
.pass{padding-top:0}
.pass::before{background:rgba(8,6,9,.72);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.ps-title{position:absolute;top:158px;left:0;right:0;text-align:center;font-size:19px;font-weight:500}
.ps-dots{position:absolute;top:208px;left:0;right:0;justify-content:center;margin:0;gap:21px}
.ps-keys{position:absolute;top:262px;left:50%;margin:0 0 0 -138px;grid-template-columns:repeat(3,76px);gap:15px 24px}
.pk{background:rgba(255,255,255,.2);font-size:36px;font-weight:400;font-family:-apple-system,'SF Pro Display',Inter,sans-serif}
.pk small{font-size:11px;letter-spacing:.22em;font-weight:700;margin-top:3px;height:12px}
.ps-foot{bottom:56px;padding:0 40px}
/* 메시지 화면 */
#sms-thread{background:#fff}
.thread-head{background:rgba(246,246,248,.96);padding:54px 10px 8px;min-height:101px;border-bottom:.5px solid #c8c8cc;justify-content:space-between;align-items:flex-start}
.back2{background:none;border:0;color:var(--blue);width:34px;height:34px;display:grid;place-items:center;cursor:pointer;margin-top:4px}
.back2 svg{width:22px;height:22px}
.thread-head .ctr{left:64px;right:64px;bottom:7px}
.avs{width:38px;height:38px;margin:0 auto 3px;border-radius:50%;background:linear-gradient(#a9afba,#868c97);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:600;overflow:hidden}
.thread-head .ctr span{font-size:12px;color:var(--ink)}
.vid{color:var(--blue);width:34px;margin-top:8px;display:grid;place-items:center}
.vid svg{width:30px;height:22px}
.msgs{gap:2px;padding:12px 14px 8px}
.b{font-size:17px;line-height:1.3;padding:7px 13px 8px;border-radius:18px;max-width:75%}
.b.me{background:#0b84fe;border-bottom-right-radius:18px}
.b.them{background:#e9e9eb;border-bottom-left-radius:18px}
.b.tl{margin-bottom:7px}
#app-sms .b.tl{position:relative}

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const C = SCRIPT.contacts;
const G = SCRIPT.groups || [];
const byId = id => C.find(c => c.id === id) || G.find(g => g.id === id);
const CH = () => C.filter(c => !c.phoneOnly);
const ALL = () => C.concat(G);
const norm = t => String(t).toLowerCase().replace(/\s+/g, '');
const digits = s => String(s).replace(/\D/g, '');
const fmtT = d => new Date(d).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit', hour12: true });
const fmtNum = d0 => {
  const d = digits(d0);
  if (d.startsWith('02')) { if (d.length <= 2) return d; if (d.length <= 5) return d.slice(0, 2) + '-' + d.slice(2); if (d.length <= 9) return d.slice(0, 2) + '-' + d.slice(2, 5) + '-' + d.slice(5); return d.slice(0, 2) + '-' + d.slice(2, 6) + '-' + d.slice(6); }
  if (d.length < 4) return d;
  if (d.length < 8) return d.slice(0, 3) + '-' + d.slice(3);
  if (d.length === 10) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
  return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);

function startCall(number, video) {
  if (call && call.state !== 'ended') { toast('이미 통화 중이에요'); return; }
  const c = C.find(x => digits(x.number) === digits(number));
  if (!c || c.noCall) return;

  call = { c, number: digits(number), lines: c ? c.call.lines : SCRIPT.unknownCall, end: c ? c.call.end : 'hangup', state: 'dialing', dir: 'out', secs: 0, id: ++callSeq, video: !!video };

    if (sc.unavailable) { call.unavail = true; call.lines = SCRIPT.unavailCall || [{ who: 'sys', text: '연결음이 울립니다…', wait: 1500 }, { who: 'sys', text: '고객님이 전화를 받을 수 없습니다.', wait: 3500 }]; call.end = 'hangup'; }

async function run(k) {

  await play(k);
}

}

  k.done = true;

    if (k.c && !k.unavail) addCap('sys', '상대방이 전화를 끊었습니다');

  /* ---- 스토리 ---- */
  function stClose() {
    clearTimeout(stTimer); stIdx = -1; $('#ig-story').classList.remove('on'); $('#screen').classList.remove('story-on');
  }
  function stShow(i) {
    clearTimeout(stTimer);
    if (i >= F.stories.length) { stClose(); return; }
    stIdx = i; const s = F.stories[i];
    $('#ig-story').classList.add('on'); $('#screen').classList.add('story-on');
    $('#st-name').textContent = s.me ? '내 스토리' : s.name; $('#st-time').textContent = '3시간';
    $('#st-av').innerHTML = s.me ? `<span class="pav" style="width:38px;height:38px;background:#c8ccd4">${SIL(26)}</span>` : av(s.name, s.color, 38, 16);
    $('#st-img').innerHTML = s.me ? '' : scene(STORY_ART[i % STORY_ART.length]);
    $('#st-img').classList.toggle('plain', !!s.me);
    $('#st-mid').innerHTML = s.me ? `<span>${sv('plus', 44, 1.8)}</span><small>사진 추가</small>` : '';
    const bar = $('#st-bar'); bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = 'stp 5s linear forwards';
    stTimer = setTimeout(() => stShow(i + 1), 5000);
  }

  /* ---- 이벤트 ---- */
  const like = (el, force) => {
    const p = posts[+el.dataset.i], on = force === true ? true : !p.liked;
    if (on === p.liked) return;
    p.liked = on; p.likes += on ? 1 : -1;
    $('[data-act="like"]', el).classList.toggle('on', on); $('[data-likes]', el).textContent = fmtK(p.likes);
  };
  root.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('[data-godm]')) { igSet('dm'); return; }
    if (t.closest('[data-tohome]')) { igSet('home'); return; }
    if (t.closest('#pd-back')) { igSet('me'); $$('#ignav button').forEach(b => b.classList.toggle('on', b.dataset.t === 'me')); return; }
    const pdt = t.closest('[data-pd]'); if (pdt) { $('#pd-art').innerHTML = scene(+pdt.dataset.pd) + '<span class="cnt">1/1</span>'; igSet('pd'); $$('#ignav button').forEach(b => b.classList.toggle('on', b.dataset.t === 'me')); return; }
    const nv = t.closest('#ignav button[data-t]');
    if (nv) { if (nv.dataset.t === tab && tab === 'home') $('#feedscroll').scrollTo({ top: 0, behavior: 'smooth' }); else igSet(nv.dataset.t); return; }
    if (t.closest('#st-x')) { stClose(); return; }
    const st = t.closest('.st'); if (st) { stShow(+st.dataset.st); return; }
    if (t.closest('#ig-story')) { stShow(stIdx + 1); return; }
    if (t.closest('[data-close]')) { csClose(); return; }
    const emo = t.closest('[data-emo]'); if (emo) { csAdd(emo.dataset.emo); return; }
    const cl = t.closest('[data-clike]'); if (cl) { const c = posts[csPost].cms[+cl.closest('.cmi').dataset.ci]; c.liked = !c.liked; c.likes += c.liked ? 1 : -1; renderCs(); return; }
    const dm = t.closest('.dmr'); if (dm) { openRoom(dm.dataset.id); return; }
    if (t.closest('#ig-rback')) { igSet('dm'); return; }
    const b = t.closest('[data-act]'); if (!b) return;
    const art = b.closest('.igp');
    if (b.dataset.act === 'like') like(art);
    else if (b.dataset.act === 'cm') csOpen(+art.dataset.i);
  });
  root.addEventListener('dblclick', e => {
    const a = e.target.closest('.igart'); if (!a) return;
    like(a.closest('.igp'), true);
    const pop = $('.pop', a); pop.classList.remove('go'); void pop.offsetWidth; pop.classList.add('go');
  });
  $('#cs-form').addEventListener('submit', e => { e.preventDefault(); const i = $('#cs-input'); csAdd(i.value); i.value = ''; });
  $('#ig-rform').addEventListener('submit', e => {
    e.preventDefault();
    const inp = $('#ig-rinput'), t = inp.value.trim(); if (!t || !room) return;
    DMS.find(x => x.id === room).msgs.push(['me', t]); inp.value = ''; renderRoom();
  });
  renderDmList();
}

const BROWSER = {};
const XLOCK = '<svg class="xlock" viewBox="0 0 24 24" width="15" height="15" aria-label="비공개 계정"><path d="M7 10V7.5a5 5 0 0 1 10 0V10h.5A1.5 1.5 0 0 1 19 11.5v8A1.5 1.5 0 0 1 17.5 21h-11A1.5 1.5 0 0 1 5 19.5v-8A1.5 1.5 0 0 1 6.5 10zm2 0h6V7.5a3 3 0 0 0-6 0z" fill="currentColor"/></svg>';
const xlink = s => esc(s).replace(/((?:https?:\/\/)?(?:www\.)?[a-z0-9][a-z0-9-]*(?:\.[a-z0-9-]+)+(?:\/[^\s<]*)?)/gi, m => /\.[a-z]{2,}/i.test(m) ? `<a class="xlink" data-url="${m}">${m}</a>` : m);
function buildPost() {
  const root = $('#app-post');
  let items = SCRIPT.timeline.map(t => ({ ...t, liked: false, rted: false }));
  root.innerHTML = `<div class="view on">
    <div class="topbar xbar">${SCRIPT.myXAvatar ? `<img class="av xs xavi" alt="" src="${esc(SCRIPT.myXAvatar)}">` : `<span class="av xs" style="background:#0a7cff">${esc((SCRIPT.ownerName || '나')[0])}</span>`}<b>X</b><span style="width:28px"></span></div>
    <div class="seg2"><button class="on" type="button" data-s="a">추천</button><button type="button" data-s="b">팔로잉</button></div>
    <div class="scroll" id="tlscroll" style="padding-bottom:90px"></div>
    <button class="fab" id="tlfab" type="button" aria-label="새 글 쓰기">${IC.pen}</button>
  </div>
  <div class="view" id="tlcompose" style="background:#fff;z-index:4">
    <div class="topbar" style="padding-top:58px"><button class="linkbtn" id="tlcancel" type="button">취소</button><button class="postbtn" id="tlpost" type="button" disabled>게시</button></div>
    <div class="cbody">${SCRIPT.myXAvatar ? `<img class="av xavi" alt="" src="${esc(SCRIPT.myXAvatar)}">` : `<span class="av" style="background:#0a7cff">${esc((SCRIPT.ownerName || '나')[0])}</span>`}<textarea id="tltext" maxlength="200" placeholder="무슨 일이 일어나고 있나요?" aria-label="새 글"></textarea></div>
    <div class="ccount" id="tlcount">0 / 200</div>
  </div>`;
  const list = $('#tlscroll');
  const render = fol => {
    const arr = fol ? items.filter(t => t.follow || t.mine) : items;
    if (!arr.length) { list.innerHTML = '<div class="xempty"><b>아직 팔로우한 계정의 글이 없어요</b><span>팔로우한 계정이 글을 올리면 여기에 보여요.</span></div>'; return; }
    list.innerHTML = arr.map((t, i) => {
      const idx = items.indexOf(t);
      return `<article class="tw" data-i="${idx}">${t.avatar ? `<img class="av xavi" alt="" src="${esc(t.avatar)}">` : `<span class="av" style="background:${t.color}">${esc(t.name[0])}</span>`}<div class="tb"><div class="th"><b>${esc(t.name)}</b>${t.private ? XLOCK : ''}<small>@${esc(t.handle)} · ${esc(t.time)}</small></div>${t.replyTo ? `<small class="xrpl">@${esc(t.replyTo)}님에게 보내는 답글</small>` : ''}${t.text ? `<p>${xlink(t.text)}</p>` : '<p></p>'}${t.photos && t.photos.length ? `<div class="xph n${Math.min(4, t.photos.length)}">${t.photos.slice(0, 4).map(s => `<img alt="" src="${esc(s)}">`).join('')}</div>` : ''}
      <div class="ta"><button data-a="re" type="button">${IC.cmt}<span>${t.replies}</span></button><button data-a="rt"${t.private ? ' data-soon' : ''} class="${t.rted ? 'on rtk' : ''}" type="button">${IC.rt}<span>${t.reposts + (t.rted ? 1 : 0)}</span></button><button data-a="lk" class="${t.liked ? 'on lkk' : ''}" type="button">${IC.heart}<span>${t.likes + (t.liked ? 1 : 0)}</span></button><button data-a="sh" type="button">${IC.share}</button></div></div></article>`;
    }).join('');
  };
  let rev = false; render(rev);
  list.addEventListener('click', e => {
    const ln = e.target.closest('.xlink'); if (ln) { openApp('browser'); if (BROWSER.go) BROWSER.go(ln.dataset.url); return; }
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const t = items[+b.closest('.tw').dataset.i], a = b.dataset.a;
    if (a === 'lk') t.liked = !t.liked; else if (a === 'rt') { t.rted = !t.rted; if (t.rted) toast('재게시했어요'); }
    else if (a === 'sh') { toast('링크를 복사했어요'); return; }
    else if (a === 're') { openCompose(t); return; }
    else { toastSoon(); return; }
    const st = list.scrollTop; render(rev); list.scrollTop = st;
  });
  $('.seg2', root).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('.seg2 button', root).forEach(x => x.classList.toggle('on', x === b));
    rev = b.dataset.s === 'b'; render(rev);
  });
  const T = $('#tltext'), P = $('#tlpost');
  let replyTo = null;
  const openCompose = to => {
    replyTo = to || null;
    $('#tlcompose').classList.add('on'); T.value = ''; P.disabled = true; $('#tlcount').textContent = '0 / 200';
    T.placeholder = replyTo ? `@${replyTo.handle}님에게 답글 남기기` : '무슨 일이 일어나고 있나요?';
    P.textContent = replyTo ? '답글' : '게시';
    T.focus({ preventScroll: true });
  };
  $('#tlfab').onclick = () => openCompose(null);
  $('#tlcancel').onclick = () => $('#tlcompose').classList.remove('on');
  T.addEventListener('input', () => { P.disabled = !T.value.trim(); $('#tlcount').textContent = T.value.length + ' / 200'; });
  P.onclick = () => {
    const v = T.value.trim(); if (!v) return;
    const mine = { private: !!SCRIPT.myXPrivate, avatar: SCRIPT.myXAvatar || '', name: SCRIPT.ownerName || '나', handle: SCRIPT.myHandle || 'my_account', color: '#0a7cff', text: v, time: '방금', replies: 0, reposts: 0, likes: 0, liked: false, rted: false, mine: true, replyTo: replyTo ? replyTo.handle : null };
    if (replyTo) replyTo.replies++;
    items.unshift(mine);
    [2500, 5000, 9000].forEach((ms, i) => setTimeout(() => { mine.likes += i + 1; if (i === 1) mine.reposts++; if (items.includes(mine)) { const st = list.scrollTop; render(rev); list.scrollTop = st; } }, ms));
    $('#tlcompose').classList.remove('on'); rev = false;
    $$('.seg2 button', root).forEach(x => x.classList.toggle('on', x.dataset.s === 'a'));
    render(rev); list.scrollTop = 0; toast(replyTo ? '답글을 보냈어요' : '게시했어요'); replyTo = null;
  };
}

const SHOTS = [], PHOTOS = {};
function buildPhotos() {

  const base0 = SCRIPT.hideDefaultPhotos ? [] : Array.from({ length: N }, (_, i) => ({ key: 'i' + i, i, date: new Date(today.getTime() - i * 3 * 86400000 - (i % 5) * 3600000) }));

  const base = userP.concat(base0).sort((a, b) => b.date - a.date);
  const totalN = () => (SCRIPT.hideDefaultPhotos ? base.length : 1345 + userP.length) + SHOTS.length;
  const allP = () => SHOTS.map((s, n) => ({ key: 's' + s.n, shot: s, date: s.date })).reverse().concat(base);
  const picP = p => p.user ? `<img alt="" src="${p.user.src}">` : p.shot ? `<img alt="" src="${p.shot.src}">${p.shot.len != null ? `<span class="vbadge">▶ ${mmss(p.shot.len)}</span>` : ''}` : pic(p.i);
  const fav = new Set((SCRIPT.hideDefaultPhotos || SCRIPT.noDefaultFav ? [] : ['i1', 'i4', 'i9', 'i14']).concat(userP.filter(p => p.user.fav).map(p => p.key)));
  const ALB = [['최근 항목', () => allP()], ['즐겨찾는 사진', () => allP().filter(p => fav.has(p.key))], ['카메라로 찍은 사진', () => allP().filter(p => p.shot || (p.user && p.user.camera))], ['풍경', () => base.filter(p => p.i != null && p.i % 2 === 0)], ['노을', () => base.filter(p => p.i != null && p.i % 3 === 0)]].filter(a => !SCRIPT.hideDefaultPhotos || (a[0] !== '풍경' && a[0] !== '노을'));
  let mode = 'all', album = null, shown = allP(), vi = 0;
  root.innerHTML = `<div class="pg5 on" id="ph-main">

  </div>`;
  const body = $('#ph-body');
  const fmtD = d => d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' }) + (dayDiff(d) === 0 ? ' ' + fmtT(d) : '');
  function render() {

  $('#' + kind + '-back').onclick = backToList;

    cur: () => cur,

    async scripted(id, msgs, ep) {
      for (const m of msgs) {

            }
            await sleep(380);
            I.value = ''; B.disabled = true; I.readOnly = false; I.classList.remove('autotype');
          } else await sleep(Math.min(1500, String(m.text).length * 60));
          if (ep !== epoch) return;

        }

    },
    reset() { cur = null; Object.keys(typing).forEach(k => delete typing[k]); Object.keys(chain).forEach(k => delete chain[k]);
      showPage(isSms ? 'list' : 'friends'); renderList(); }
  };
}

const PW = 393, PH = 804;
const MOB = () => Math.min(innerWidth, screen.width || innerWidth) <= 700 || (matchMedia('(pointer:coarse)').matches && innerWidth <= 900);
function fit() {
  const ph = $('#phone'), sc = $('#screen');
  if (MOB()) {
    document.body.classList.add('mob');
    // 실제로 보이는 영역 크기: 화면에 고정된 투명 상자로 재서, 아래 툴바·홈 막대 뒤로 숨는 부분을 빼고 맞춤
    let pr = document.getElementById('vp-probe');
    if (!pr) { pr = document.createElement('div'); pr.id = 'vp-probe'; document.body.append(pr); }
    const pb = pr.getBoundingClientRect(), vv = window.visualViewport;
    const vw = Math.round(pb.width) || document.documentElement.clientWidth;
    const vh = Math.round(Math.min(pb.height || innerHeight, vv ? vv.height : innerHeight, innerHeight));
    if (!(vv && vv.height < innerHeight - 80)) window.scrollTo(0, 0);
    const s = vw / PW, H = Math.round(vh / s);
    SCALE = s;
    ph.style.setProperty('height', H + 'px', 'important');
    sc.style.setProperty('height', (H + 48) + 'px', 'important');
    $('#sizer').style.width = vw + 'px'; $('#sizer').style.height = vh + 'px';

#ed-status{font-size:12.5px;color:var(--muted);flex:1;min-width:120px}

#ed-status[data-k=ok]{color:var(--accent)}
#ed-status[data-k=err]{color:#d93025}
.ed-act{display:flex;gap:8px;flex-wrap:wrap}
.ed-draft{margin:10px 16px 0;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.ed-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.ed-tabs button{font:inherit;font-size:13px;white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.ed-tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.ed-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.ed-body .note{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
.ed-body h4{margin:12px 0 0;font-size:14px}
.ed .ef{display:flex;flex-direction:column;gap:5px;min-width:0}
.ed .el{font-size:12px;font-weight:600;color:var(--muted)}
.ed .eh{font-size:11.5px;color:var(--muted)}
.ed input[type=text],.ed input[type=number],.ed input[type=date],.ed input:not([type]),.ed textarea,.ed select{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
.ed textarea{resize:vertical;line-height:1.45}
.ed input[type=color]{width:44px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.ed input:focus,.ed textarea:focus,.ed select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.ed .ec{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer}
.ed .ec input{width:17px;height:17px;accent-color:var(--accent)}
.ed .checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.ed .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ed .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ed .es{border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.ed .es>summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:14px}
.ed .esb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.ed .eb{font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;white-space:nowrap}
.ed .eb.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.ed .eb.add{border-style:dashed;align-self:flex-start}
.ed .eb.sm{padding:4px 8px;font-size:12px}
.ed .eb.del{color:#d93025}
.ed .eb.danger{color:#d93025;border-color:#d93025}
.ed .eb.danger.arm{background:#d93025;color:#fff}
.ed .ml{display:flex;flex-direction:column;gap:6px}
.ed .mr{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;padding:6px;border-radius:9px;background:var(--bg);border:1px solid var(--line)}
.ed .mr.me{border-left:3px solid #0a7cff}
.ed .mr.them{border-left:3px solid #9aa3ad}
.ed .mr.sys{border-left:3px solid #f0ad4e}
.ed .mr .who{width:auto;flex:0 0 auto;max-width:130px}

.ed .ago .unit{width:auto}
.ed .ert{display:inline-flex;flex-direction:row;gap:3px;margin-left:auto;flex:none}
.ed .rr{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:start;padding:8px;border-radius:9px;background:var(--bg);border:1px solid var(--line)}

}
.ed .split{display:grid;grid-template-columns:180px 1fr;gap:14px;align-items:start}
@media (max-width:620px){.ed .split{grid-template-columns:1fr}
}
.ed .elist{display:flex;flex-direction:column;gap:4px;position:sticky;top:0}

}
.ed .eli{display:flex;align-items:center;gap:8px;font:inherit;font-size:13.5px;text-align:left;padding:8px 10px;border-radius:9px;border:1px solid transparent;background:none;color:var(--fg);cursor:pointer}
.ed .eli i{width:12px;height:12px;border-radius:4px;flex:none}
.ed .eli small{margin-left:auto;font-size:11px;color:var(--muted)}
.ed .eli.on{background:var(--panel);border-color:var(--line);font-weight:600}
.edet{display:flex;flex-direction:column;gap:12px;min-width:0}
.ed .erow{display:flex;gap:8px;align-items:center;justify-content:space-between}
.ed .card{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel);margin-bottom:10px}
.ed .thr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ed .th{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;background:var(--line);flex:none}
.ed .th img{width:100%;height:100%;object-fit:cover;display:block}
.ed .th .eb{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:0}
.ed .pgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ed .pc{display:flex;flex-direction:column;gap:5px}
.ed .pc .th{width:100%;height:auto;aspect-ratio:1/1}
.ed .pc input{font-size:12px!important;padding:5px!important}
.ed .dt{width:190px!important;flex:none}
.ed .mr .thr .th{width:44px;height:44px}
.ed .dte{display:inline-flex;gap:4px;flex-wrap:wrap}
.ed .dte .dd{width:150px!important;flex:none}
.ed .dte .tt{width:110px!important;flex:none}
.ed .hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.ed .hc{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.ed .dlab{min-width:60px;font-size:13px}
.ed .eaud{height:36px;max-width:260px}
